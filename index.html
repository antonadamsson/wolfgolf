function getWolfPoints(holeIdx, wolfData, scores, players, playersData, extraOvr, pointsOvr, wolfOrder, courseHoles, rollover) {
  const ov = pointsOvr?.[holeIdx];
  if (ov && players.every(p => ov[p] !== undefined && ov[p] !== "" && ov[p] !== null)) {
    return { points: Object.fromEntries(players.map(p=>[p,parseInt(ov[p])||0])), isManual:true, tie:false };
  }
  const wolf = wolfOrder[holeIdx % wolfOrder.length];
  const wd = wolfData[holeIdx] || {};
  const mode = wd.mode || 'normal';
  const partner = wd.partner || null;
  const getNet = (pl) => {
    const s = parseInt(scores[pl]?.[holeIdx]);
    if (!s) return 999;
    return s - getExtraShots(pl, holeIdx, players, playersData, extraOvr, courseHoles);
  };
  const nets = Object.fromEntries(players.map(p=>[p,getNet(p)]));
  if (players.some(p => nets[p]===999)) return null;
  const base = rollover || 0;
  const points = Object.fromEntries(players.map(p=>[p,0]));

  if (mode === 'blind' || mode === 'lone') {
    const wolfNet = nets[wolf];
    const others = players.filter(p=>p!==wolf);
    const bestOther = Math.min(...others.map(p=>nets[p]));
    if (wolfNet === bestOther) return { points:Object.fromEntries(players.map(p=>[p,0])), tie:true, mode };
    if (wolfNet < bestOther) {
      points[wolf] = (mode==='blind'?8:4) + base;
    } else {
      const beaten = others.filter(p=>nets[p]===bestOther);
      const rest = others.filter(p=>nets[p]!==bestOther);
      beaten.forEach(p=>{points[p]=(mode==='blind'?3:2)+Math.floor(base/others.length);});
      rest.forEach(p=>{points[p]=(mode==='blind'?2:1)+Math.floor(base/others.length);});
    }
    return { points, wolfWins: wolfNet < bestOther, tie:false, mode };
  } else {
    if (!partner) return null;
    const t1=[wolf,partner], t2=players.filter(p=>!t1.includes(p));
    const b1=Math.min(...t1.map(p=>nets[p])), b2=Math.min(...t2.map(p=>nets[p]));
    if (b1===b2) return { points:Object.fromEntries(players.map(p=>[p,0])), tie:true, mode };
    if (b1<b2) { t1.forEach(p=>{points[p]=2+base;}); }
    else { t2.forEach(p=>{points[p]=2+base;}); }
    return { points, wolfWins: b1<b2, tie:false, mode };
  }
}

function computeRollovers(n, wolfData, scores, players, playersData, extraOvr, pointsOvr, wolfOrder, courseHoles) {
  const ro = Array(n).fill(0); let acc=0;
  for (let i=0;i<n;i++) {
    const r = getWolfPoints(i,wolfData,scores,players,playersData,extraOvr,pointsOvr,wolfOrder,courseHoles,acc);
    if (!r){ro[i]=acc;continue;}
    if (r.tie){acc+=2;ro[i]=acc;}else{ro[i]=0;acc=0;}
  }
  return ro;
}

function getExtraShots(pl, hi, players, pd, extraOvr, ch) {
  const ov=extraOvr?.[hi]?.[pl];
  if(ov!==undefined&&ov!==null&&ov!=="") return parseInt(ov);
  const ph=pd[pl]?.playingHcp||0, si=ch[hi].si, n=ch.length;
  return Math.floor(ph/n)+(si<=(ph%n)?1:0);
}

function playingHcp(idx, slope, n) { return Math.round(parseFloat(idx||0)*(slope/113)*(n/18)); }
function calcStf(s,par,extra) { if(!s)return null; return Math.max(0,2+(par-(s-extra))); }

// Score symbol: circle=birdie+, plain=par, square=bogey, double-square=double-bogey+
function ScoreSymbol({s, par, size=14, fontSize=11}) {
  if (!s) return <span style={{fontSize:`${fontSize}px`,color:"#2a4a38"}}>–</span>;
  const diff = s - par;
  // Eagle=gold, Birdie=red, Par=cream, Bogey=steel blue, Dbl+=dark rust
  const color = diff <= -2 ? "#d4af37" : diff === -1 ? "#c0392b" : diff === 0 ? "#f0ede0" : diff === 1 ? "#4a90a4" : "#8b3a2a";
  const r = size / 2; // radius for circles / half-size for squares
  if (diff <= -1) {
    // Birdie: single circle. Eagle+: double circle. Keep compact.
    const outerR = diff <= -2 ? r + 4 : r + 2;
    const outerD = outerR * 2;
    const innerD = r * 2;
    return (
      <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",position:"relative",width:`${outerD + 2}px`,height:`${outerD + 2}px`,flexShrink:0}}>
        {diff <= -2 && <span style={{position:"absolute",borderRadius:"50%",border:`1.5px solid ${color}`,width:`${outerD}px`,height:`${outerD}px`}}/>}
        <span style={{position:"absolute",borderRadius:"50%",border:`1.5px solid ${color}`,width:`${innerD + 2}px`,height:`${innerD + 2}px`}}/>
        <span style={{fontSize:`${fontSize}px`,fontWeight:"bold",color,position:"relative",zIndex:1,lineHeight:1}}>{s}</span>
      </span>
    );
  } else if (diff === 0) {
    return <span style={{fontSize:`${fontSize}px`,fontWeight:"bold",color,lineHeight:1}}>{s}</span>;
  } else if (diff === 1) {
    // Single square — tight fit
    return (
      <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",border:`1.5px solid ${color}`,width:`${r*2+6}px`,height:`${r*2+6}px`,flexShrink:0}}>
        <span style={{fontSize:`${fontSize}px`,fontWeight:"bold",color,lineHeight:1}}>{s}</span>
      </span>
    );
  } else {
    // Double bogey: two squares, keep total size tightly bounded
    const outer = r * 2 + 8;
    const inner = r * 2 + 2;
    return (
      <span style={{display:"inline-flex",alignItems:"center",justifyContent:"center",position:"relative",width:`${outer}px`,height:`${outer}px`,flexShrink:0}}>
        <span style={{position:"absolute",border:`1.5px solid ${color}`,width:`${outer - 1}px`,height:`${outer - 1}px`}}/>
        <span style={{position:"absolute",border:`1.5px solid ${color}`,width:`${inner}px`,height:`${inner}px`}}/>
        <span style={{fontSize:`${fontSize}px`,fontWeight:"bold",color,position:"relative",zIndex:1,lineHeight:1}}>{s}</span>
      </span>
    );
  }
}

// Snake: snake[holeIdx][player] = true/false (did they 3-putt)
function calcSnakeHistory(players, snake, n) {
  let holder=null; const hist=[];
  for(let i=0;i<n;i++){
    const tp=players.filter(p=>snake?.[i]?.[p]);
    if(tp.length>0) holder=tp[tp.length-1];
    hist.push({holder, newSnakers:tp});
  }
  return hist;
}

// ─── FINAL SCORECARD ─────────────────────────────────────────────────────────
function FinalScorecard({players, hcpInputs, playersData, selectedCourse, courseHoles, scores, snake, wolfData, wolfOrderInput, extraOvr, pointsOvr, wolfStake, snakeStake, b50Active, b50Players, onClose, onSave}) {
  const PC = getPC(players);
  const n = courseHoles.length;
  const rollovers = computeRollovers(n,wolfData,scores,players,playersData,extraOvr,pointsOvr,wolfOrderInput,courseHoles);

  const wolfTotal = pl => {
    let acc=0,total=0;
    for(let i=0;i<n;i++){
      const r=getWolfPoints(i,wolfData,scores,players,playersData,extraOvr,pointsOvr,wolfOrderInput,courseHoles,acc);
      if(!r)continue;
      if(r.tie){acc+=2;}else{total+=(r.points[pl]||0);acc=0;}
    }
    return total;
  };
  const stfTotal = pl => courseHoles.reduce((a,h,i)=>{const s=parseInt(scores?.[pl]?.[i]);if(!s)return a;return a+(calcStf(s,h.par,getExtraShots(pl,i,players,playersData,extraOvr,courseHoles))??0);},0);
  const totalStrokes = pl => (scores?.[pl]||[]).reduce((a,v)=>a+(parseInt(v)||0),0);
  const totalPar = courseHoles.reduce((a,h)=>a+h.par,0);

  const snakeHist = calcSnakeHistory(players, snake, n);
  const snakeHolder = snakeHist.filter(h=>h.holder).slice(-1)[0]?.holder||null;

  const wolfTotals = Object.fromEntries(players.map(p=>[p,wolfTotal(p)]));
  const stfTotals = Object.fromEntries(players.map(p=>[p,stfTotal(p)]));
  const maxWolf = Math.max(...players.map(p=>wolfTotals[p]));
  const wolfWinners = players.filter(p=>wolfTotals[p]===maxWolf);
  const maxStf = Math.max(...players.map(p=>stfTotals[p]));
  const stfWinners = players.filter(p=>stfTotals[p]===maxStf);

  const date = new Date().toLocaleDateString("sv-SE",{year:"numeric",month:"long",day:"numeric"});

  const rankEmoji = rank => rank===0?"🥇":rank===1?"🥈":rank===2?"🥉":"";

  // Per-player stableford row
  const stfRow = (pl) => courseHoles.map((h,i)=>{
    const s=parseInt(scores?.[pl]?.[i]);
    if(!s) return null;
    const extra=getExtraShots(pl,i,players,playersData,extraOvr,courseHoles);
    return calcStf(s,h.par,extra);
  });

  return (
    <div className="modal-bg" onClick={onClose}>
      <div style={{background:"#0e2318",border:"1px solid #40916c",borderRadius:"18px",padding:0,maxWidth:"500px",width:"100%",margin:"auto",overflow:"hidden"}} onClick={e=>e.stopPropagation()}>

        {/* Hero header */}
        <div style={{background:"linear-gradient(160deg,#0a2e18 0%,#1b4332 40%,#2d6a4f 70%,#1b4332 100%)",padding:"28px 20px 22px",textAlign:"center",position:"relative"}}>
          <div style={{fontSize:"11px",letterSpacing:"4px",color:"#6dbf8a",textTransform:"uppercase",marginBottom:"6px"}}>Rundan avslutad</div>
          <div style={{fontSize:"26px",fontWeight:"bold",color:"#fff",marginBottom:"4px"}}>{selectedCourse.replace(" – "," · ")}</div>
          <div style={{fontSize:"13px",color:"#a8c5a0"}}>{date}</div>
          <div style={{fontSize:"13px",color:"#a8c5a0",marginTop:"2px"}}>{n} hål · Slope {COURSES[selectedCourse]?.slope}</div>
          <button onClick={onClose} style={btn({position:"absolute",top:"14px",right:"14px",background:"rgba(0,0,0,0.3)",border:"1px solid #40916c",color:"#a8c5a0",fontSize:"16px",lineHeight:1,width:"28px",height:"28px",borderRadius:"50%"})}>×</button>
        </div>

        <div style={{padding:"0 16px 20px",overflowY:"auto",maxHeight:"75vh"}}>

          {/* Wolf podium */}
          <div style={{marginTop:"20px",marginBottom:"18px"}}>
            <div style={{fontSize:"10px",letterSpacing:"3px",color:"#a8c5a0",textTransform:"uppercase",textAlign:"center",marginBottom:"12px"}}>🐺 Wolf – Slutresultat</div>
            <div style={{display:"flex",gap:"8px",justifyContent:"center",alignItems:"flex-end",marginBottom:"12px"}}>
              {[...players].sort((a,b)=>wolfTotals[b]-wolfTotals[a]).map((pl,rank)=>{
                const pts=wolfTotals[pl];

                  </div>
                </div>

                {/* Mini scorecard */}
                <div style={{background:"rgba(0,0,0,0.2)",borderRadius:"8px",overflow:"hidden",marginBottom:"8px"}}>
                  <div style={{display:"grid",gridTemplateColumns:"26px repeat(9,1fr)",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
                    <div style={{padding:"3px 2px",fontSize:"7px",color:"#6dbf8a",textAlign:"center"}}>Hål</div>

                  <div style={{display:"grid",gridTemplateColumns:"26px repeat(9,1fr)",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>

                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"26px repeat(9,1fr)",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>

                  <div style={{display:"grid",gridTemplateColumns:"26px repeat(9,1fr)",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>

                    <div style={{padding:"3px 2px",fontSize:"7px",color:"#a8c5a0",textAlign:"center"}}>Stf</div>
                    {stf.slice(0,halfN).map((p,i)=><div key={i} style={{padding:"3px 1px",textAlign:"center"}}><span style={{fontSize:"9px",fontWeight:"bold",color:p===null?"#333":p>=3?"#f5c842":p===2?"#a8c5a0":p===1?"#6dbf8a":"#e05252"}}>{p!==null?p:"–"}</span></div>)}
                  </div>
                  {n>9&&<>
                    <div style={{display:"grid",gridTemplateColumns:"26px repeat(9,1fr)",borderBottom:"1px solid rgba(255,255,255,0.06)",borderTop:"1px solid rgba(255,255,255,0.06)"}}>
                      <div style={{padding:"3px 2px",fontSize:"7px",color:"#6dbf8a",textAlign:"center"}}>Hål</div>
                      {courseHoles.slice(halfN).map(h=><div key={h.hole} style={{padding:"3px 1px",fontSize:"7px",color:"#6dbf8a",textAlign:"center"}}>{h.hole}</div>)}
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"26px repeat(9,1fr)",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
                      <div style={{padding:"3px 2px",fontSize:"7px",color:"#6dbf8a",textAlign:"center"}}>Par</div>
                      {courseHoles.slice(halfN).map(h=><div key={h.hole} style={{padding:"3px 1px",fontSize:"7px",color:"#6dbf8a",textAlign:"center"}}>{h.par}</div>)}
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"26px repeat(9,1fr)",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
                      <div style={{padding:"3px 2px",fontSize:"7px",color:"#d4841c",textAlign:"center"}}>+</div>
                      {courseHoles.slice(halfN).map((h,i)=>{
                        const ex=getExtraShots(pl,halfN+i,players,playersData,extraOvr,courseHoles);
                        return <div key={h.hole} style={{padding:"3px 1px",textAlign:"center"}}>
                          {ex>0&&<span style={{fontSize:"8px",color:"#d4841c",fontWeight:"bold"}}>•</span>}
                        </div>;
                      })}
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"26px repeat(9,1fr)",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
                      <div style={{padding:"3px 2px",fontSize:"7px",color:"#a8c5a0",textAlign:"center"}}>Slag</div>
                      {courseHoles.slice(halfN).map((h,i)=>{
                        const idx=halfN+i, s=parseInt(scores[pl][idx])||0;
                        return <div key={h.hole} style={{padding:"2px 1px",textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",height:"18px"}}>
                          <ScoreSymbol s={s} par={h.par} size={11} fontSize={9}/>
                        </div>;
                      })}
                    </div>
                    <div style={{display:"grid",gridTemplateColumns:"26px repeat(9,1fr)"}}>
                      <div style={{padding:"3px 2px",fontSize:"7px",color:"#a8c5a0",textAlign:"center"}}>Stf</div>
                      {stf.slice(halfN).map((p,i)=><div key={i} style={{padding:"3px 1px",textAlign:"center"}}><span style={{fontSize:"9px",fontWeight:"bold",color:p===null?"#333":p>=3?"#f5c842":p===2?"#a8c5a0":p===1?"#6dbf8a":"#e05252"}}>{p!==null?p:"–"}</span></div>)}
                    </div>
                  </>}
                </div>

                {/* Stats row */}
                <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"6px",marginBottom:"8px"}}>
                  {[["Slag",sw||"–","#f0ede0"],["vs Par",sw?(diff>0?`+${diff}`:diff===0?"E":diff):"–",diff>0?"#5aabdf":diff<0?"#c0392b":"#f0ede0"],["Ut",`${utSlg||"–"} / ${utStf}p`,"#a8c5a0"],["In",`${inSlg||"–"} / ${inStf}p`,"#a8c5a0"]].map(([label,val,color])=>(
                    <div key={label} style={{background:"rgba(0,0,0,0.2)",borderRadius:"6px",padding:"6px 4px",textAlign:"center"}}>
                      <div style={{fontSize:"8px",color:"#6dbf8a",marginBottom:"2px",textTransform:"uppercase"}}>{label}</div>
                      <div style={{fontSize:"12px",fontWeight:"bold",color}}>{val}</div>
                    </div>
                  ))}
                </div>
                {/* Extra shot holes */}
                {(()=>{
                  const extraHoles = courseHoles.filter((_,i)=>getExtraShots(pl,i,players,playersData,extraOvr,courseHoles)>0).map(h=>h.hole);
                  return extraHoles.length>0 ? (
                    <div style={{background:"rgba(212,132,28,0.08)",border:"1px solid rgba(212,132,28,0.25)",borderRadius:"7px",padding:"6px 10px",fontSize:"11px",color:"#a8c5a0"}}>
                      <span style={{color:"#d4841c",fontWeight:"bold"}}>+slag på:</span> <span style={{color:"#f0ede0"}}>{extraHoles.join(", ")}</span>
                    </div>
                  ) : (
                    <div style={{background:"rgba(0,0,0,0.1)",borderRadius:"7px",padding:"5px 10px",fontSize:"11px",color:"#3a5a47"}}>Inga extra slag på den här banan</div>

          </div>

          {/* Wolf hole-by-hole */}
          <div style={{marginBottom:"18px"}}>
            <div style={{fontSize:"10px",letterSpacing:"3px",color:"#a8c5a0",textTransform:"uppercase",textAlign:"center",marginBottom:"8px"}}>🐺 Wolf – Hål för hål</div>
            <div style={{background:"rgba(0,0,0,0.2)",borderRadius:"10px",overflow:"hidden",border:"1px solid #1b4332"}}>
              <div style={{display:"grid",gridTemplateColumns:`28px 24px repeat(${players.length},1fr)`,background:"#1a4731"}}>
                {["Hål","🐺",...players].map((h,i)=><div key={i} style={{padding:"5px 2px",fontSize:"8px",color:i>1?PC[players[i-2]]:"#6dbf8a",textAlign:"center",fontWeight:"bold"}}>{h}</div>)}
              </div>
              {courseHoles.map((h,i)=>{
                const ro=i>0?rollovers[i-1]:0;
                const res=getWolfPoints(i,wolfData,scores,players,playersData,extraOvr,pointsOvr,wolfOrderInput,courseHoles,ro);
                const wolf=wolfOrderInput[i%wolfOrderInput.length];
                const wd=wolfData[i]||{};
                const manual=pointsOvr[i]&&players.every(p=>pointsOvr[i][p]!=="");
                return <div key={h.hole} style={{display:"grid",gridTemplateColumns:`28px 24px repeat(${players.length},1fr)`,background:i%2?"rgba(255,255,255,0.02)":"transparent",borderBottom:"1px solid rgba(45,106,79,0.2)",alignItems:"center"}}>
                  <div style={{textAlign:"center",fontSize:"10px",color:"#f5c842",padding:"5px 0",fontWeight:"bold"}}>{h.hole}</div>
                  <div style={{textAlign:"center",fontSize:"9px",color:PC[wolf]||"#fff"}}>
                    {wd.mode==='blind'?"🌑":wd.mode==='lone'?"🐺Ⅰ":wd.partner?`${wolf[0]}+${wd.partner[0]}`:"?"}
                    {manual&&<span style={{color:"#d4841c"}}> M</span>}
                  </div>
                  {players.map(pl=>{
                    const pts=res?.points?.[pl];
                    return <div key={pl} style={{textAlign:"center",fontSize:"10px",padding:"5px 1px",fontWeight:"bold",color:res?.tie?"#9b6dcc":pts===undefined||pts===null?"#2a2a2a":pts>0?"#6dbf8a":pts<0?"#e05252":"#444"}}>
                      {res?.tie?"~":pts!==undefined&&pts!==null?(pts>0?`+${pts}`:String(pts)):"–"}
                    </div>;
                  })}
                </div>;
              })}
              <div style={{display:"grid",gridTemplateColumns:`28px 24px repeat(${players.length},1fr)`,background:"#1a4731",padding:"5px 0"}}>
                <div style={{gridColumn:"1/3",textAlign:"center",fontSize:"8px",color:"#a8c5a0",display:"flex",alignItems:"center",justifyContent:"center"}}>Σ</div>
                {players.map(pl=>{const pts=wolfTotals[pl];return(
                  <div key={pl} style={{textAlign:"center",fontSize:"12px",fontWeight:"bold",color:wolfWinners.includes(pl)?"#f5c842":pts>0?"#6dbf8a":pts<0?"#e05252":"#888"}}>{pts>0?`+${pts}`:pts}</div>
                );})}
              </div>
            </div>
          </div>

          {/* Snake summary */}
          <div style={{marginBottom:"18px",padding:"14px",background:"rgba(255,107,107,0.06)",border:`1px solid ${snakeHolder?"#e05252":"#2d6a4f"}`,borderRadius:"12px"}}>
            <div style={{fontSize:"10px",letterSpacing:"3px",color:"#a8c5a0",textTransform:"uppercase",marginBottom:"8px",textAlign:"center"}}>🐍 Snake</div>
            {snakeHolder
              ? <div style={{textAlign:"center",marginBottom:"8px"}}>
                  <div style={{fontSize:"13px",color:"#aaa"}}>Ormbärare vid rundan slut</div>
                  <div style={{fontSize:"22px",fontWeight:"bold",color:PC[snakeHolder]||"#e05252",marginTop:"2px"}}>🐍 {snakeHolder}</div>
                </div>
              : <div style={{textAlign:"center",color:"#6dbf8a",fontSize:"13px",marginBottom:"8px"}}>Ingen ormbärare 🎉</div>
            }
            {/* Snake history */}
            <div style={{display:"flex",gap:"4px",flexWrap:"wrap",justifyContent:"center"}}>
              {snakeHist.map((h,i)=>{
                if(!h.newSnakers.length&&!h.holder) return null;
                return <div key={i} style={{fontSize:"10px",textAlign:"center",minWidth:"22px"}}>
                  <div style={{color:"#6dbf8a",fontSize:"8px"}}>{courseHoles[i].hole}</div>
                  <div>{h.newSnakers.length>0?<span style={{color:"#e05252"}}>🐍</span>:<span style={{color:"#ff6b6b33",fontSize:"8px"}}>○</span>}</div>
                </div>;
              }).filter(Boolean)}
            </div>
          </div>

          {/* 💸 Payouts */}
          {(parseInt(wolfStake)>0||parseInt(snakeStake)>0||b50Active)&&<div style={{marginBottom:"18px",padding:"14px",background:"rgba(255,215,0,0.05)",border:"1px solid #ffd70044",borderRadius:"12px"}}>
            <div style={{fontSize:"12px",letterSpacing:"2px",color:"#f5c842",textTransform:"uppercase",marginBottom:"14px",textAlign:"center",fontWeight:"bold"}}>💸 Swisha</div>

            {/* Wolf payout */}
            {parseInt(wolfStake)>0&&<div style={{marginBottom:"14px"}}>
              <div style={{fontSize:"12px",fontWeight:"bold",color:"#f5c842",marginBottom:"8px"}}>🐺 Wolf · {wolfWinners.join(" & ")} vinner</div>
              {wolfWinners.map(winner=>(
                <div key={winner}>
                  {players.filter(p=>!wolfWinners.includes(p)).map(p=>(
                    <div key={p} style={{display:"flex",alignItems:"center",gap:"8px",background:"rgba(0,0,0,0.2)",borderRadius:"7px",padding:"7px 10px",marginBottom:"4px"}}>
                      <div style={{fontSize:"12px",color:PC[p],flex:1}}>{p}</div>
                      <div style={{fontSize:"11px",color:"#aaa"}}>→</div>
                      <div style={{fontSize:"14px",fontWeight:"bold",color:PC[winner]}}>{wolfStake} kr</div>
                      <div style={{fontSize:"11px",color:PC[winner]}}>{winner}</div>
                    </div>
                  ))}
                </div>
              ))}
            </div>}

            {/* Snake payout */}
            {parseInt(snakeStake)>0&&snakeHolder&&<div style={{marginBottom:"14px",paddingTop:parseInt(wolfStake)>0?"12px":"0",borderTop:parseInt(wolfStake)>0?"1px solid rgba(255,255,255,0.06)":"none"}}>
              <div style={{fontSize:"12px",fontWeight:"bold",color:"#e05252",marginBottom:"8px"}}>🐍 Snake · {snakeHolder} betalar</div>
              {players.filter(p=>p!==snakeHolder).map(p=>(
                <div key={p} style={{display:"flex",alignItems:"center",gap:"8px",background:"rgba(0,0,0,0.2)",borderRadius:"7px",padding:"7px 10px",marginBottom:"4px"}}>
                  <div style={{fontSize:"12px",color:PC[p],flex:1}}>{p}</div>
                  <div style={{fontSize:"11px",color:"#aaa"}}>får</div>
                  <div style={{fontSize:"14px",fontWeight:"bold",color:"#6dbf8a"}}>{snakeStake} kr</div>
                  <div style={{fontSize:"11px",color:"#e05252"}}>från {snakeHolder}</div>
                </div>
              ))}
            </div>}

            {/* B50 payouts */}
            {b50Active&&b50Players&&b50Players.length>=2&&(()=>{
              const b50Birdies = Object.fromEntries(b50Players.map(p=>[p,0]));
              courseHoles.forEach((h,i)=>{
                b50Players.forEach(pl=>{
                  const s=parseInt(scores?.[pl]?.[i]);
                  const extra=getExtraShots(pl,i,players,playersData,extraOvr,courseHoles);
                  if(s&&(s-extra)<h.par) b50Birdies[pl]=(b50Birdies[pl]||0)+1;
                });
              });
              const hasBirdies=b50Players.some(p=>b50Birdies[p]>0);
              const showBorder=(parseInt(wolfStake)>0||parseInt(snakeStake)>0&&snakeHolder);
              return <div style={{paddingTop:showBorder?"12px":"0",borderTop:showBorder?"1px solid rgba(255,255,255,0.06)":"none"}}>
                <div style={{fontSize:"12px",fontWeight:"bold",color:"#6dbf8a",marginBottom:"8px"}}>🐦 B50 – Birdie-betalningar</div>
                {!hasBirdies&&<div style={{fontSize:"12px",color:"#3a5a47"}}>Inga birdies den här rundan</div>}
                {b50Players.filter(p=>b50Birdies[p]>0).map(winner=>{
                  const payers=b50Players.filter(p=>p!==winner);
                  const perBirdie=payers.length*50;
                  const total=perBirdie*b50Birdies[winner];
                  return <div key={winner} style={{marginBottom:"10px"}}>
                    <div style={{fontSize:"11px",color:PC[winner],fontWeight:"bold",marginBottom:"5px"}}>
                      {winner} – {b50Birdies[winner]} birdie{b50Birdies[winner]>1?"s":""} = <span style={{color:"#f5c842"}}>{total} kr</span>
                    </div>
                    {payers.map(p=>(
                      <div key={p} style={{display:"flex",alignItems:"center",gap:"8px",background:"rgba(0,0,0,0.2)",borderRadius:"7px",padding:"6px 10px",marginBottom:"3px"}}>
                        <div style={{fontSize:"12px",color:PC[p],flex:1}}>{p}</div>
                        <div style={{fontSize:"11px",color:"#aaa"}}>→</div>
                        <div style={{fontSize:"14px",fontWeight:"bold",color:PC[winner]}}>{50*b50Birdies[winner]} kr</div>
                        <div style={{fontSize:"11px",color:PC[winner]}}>{winner}</div>
                      </div>
                    ))}
                  </div>;
                })}
              </div>;
            })()}
          </div>}

          {/* Action buttons */}
          <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
            <button onClick={onSave} style={btn({width:"100%",padding:"13px",borderRadius:"10px",border:"none",background:"linear-gradient(135deg,#2d6a4f,#40916c)",color:"#fff",fontSize:"15px",fontWeight:"bold"})}>💾 Spara i historiken</button>
            <button onClick={onClose} style={btn({width:"100%",padding:"10px",borderRadius:"10px",border:"1px solid #40916c",background:"transparent",color:"#a8c5a0",fontSize:"13px"})}>Tillbaka till spelet</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── HISTORY ────────────────────────────────────────────────────────────────
function HistoryScreen({onBack}) {
  const [hist,setHist]=useState(()=>{try{return JSON.parse(localStorage.getItem(HIST_KEY)||"[]");}catch{return [];}});
  const [detail,setDetail]=useState(null);
  const del=(id)=>{const h=hist.filter(r=>r.id!==id);setHist(h);localStorage.setItem(HIST_KEY,JSON.stringify(h));if(detail?.id===id)setDetail(null);};

  if(detail){
    const PC=getPC(detail.players);
    const maxWolf=Math.max(...detail.players.map(p=>detail.wolfTotals[p]||0));
    const winners=detail.players.filter(p=>(detail.wolfTotals[p]||0)===maxWolf);
    return <div style={{minHeight:"100vh",background:"#0e2318",paddingBottom:"60px"}}>
      <div style={{background:"linear-gradient(160deg,#1a4731 0%,#2d6a4f 60%,#1a4731 100%)",padding:"14px 16px",display:"flex",alignItems:"center",gap:"12px",borderBottom:"2px solid #40916c",position:"sticky",top:0,zIndex:10}}>
        <button onClick={()=>setDetail(null)} style={btn({background:"transparent",border:"1px solid #40916c",color:"#a8c5a0",padding:"5px 10px",borderRadius:"7px",fontSize:"12px"})}>← Tillbaka</button>
        <div><div style={{fontSize:"14px",fontWeight:"bold",color:"#fff"}}>{detail.course}</div><div style={{fontSize:"11px",color:"#a8c5a0"}}>{detail.date}</div></div>
      </div>
      <div style={{padding:"14px"}}>
        {detail.players.map((pl,rank)=>{
          const pts=detail.wolfTotals[pl]||0;
          const isW=winners.includes(pl);
          return <div key={pl} style={{display:"flex",alignItems:"center",gap:"10px",background:isW?"rgba(255,215,0,0.07)":"rgba(255,255,255,0.04)",border:`1px solid ${isW?"#f5c842":"#2d6a4f"}`,borderRadius:"10px",padding:"10px 12px",marginBottom:"6px"}}>
            <div style={{fontSize:"18px"}}>{isW?"🏆":rank===1?"🥈":rank===2?"🥉":"–"}</div>
            <div style={{flex:1}}><div style={{fontSize:"14px",fontWeight:"bold",color:PC[pl]}}>{pl}</div><div style={{fontSize:"10px",color:"#6dbf8a"}}>HCP {detail.hcpInputs?.[pl]||"–"} · {detail.stfTotals?.[pl]||0}p stf</div></div>
            <div style={{fontSize:"22px",fontWeight:"bold",color:pts>0?"#6dbf8a":pts<0?"#e05252":"#888"}}>{pts>0?`+${pts}`:pts}</div>
          </div>;
        })}
        {detail.snakeHolder&&<div style={{padding:"10px 12px",background:"rgba(255,107,107,0.08)",border:"1px solid #ff6b6b",borderRadius:"9px",marginTop:"4px",fontSize:"12px",color:"#e05252"}}>🐍 Ormbärare: <b>{detail.snakeHolder}</b></div>}
        <button onClick={()=>del(detail.id)} style={btn({width:"100%",padding:"9px",borderRadius:"7px",border:"1px solid #ff6b6b22",background:"transparent",color:"#ff6b6b44",fontSize:"11px",marginTop:"14px"})}>🗑 Ta bort rond</button>
      </div>
    </div>;
  }

  return <div style={{minHeight:"100vh",background:"#0e2318",paddingBottom:"60px"}}>
    <div style={{background:"linear-gradient(160deg,#1a4731 0%,#2d6a4f 60%,#1a4731 100%)",padding:"14px 16px",display:"flex",alignItems:"center",gap:"12px",borderBottom:"2px solid #40916c",position:"sticky",top:0,zIndex:10}}>
      <button onClick={onBack} style={btn({background:"transparent",border:"1px solid #40916c",color:"#a8c5a0",padding:"5px 10px",borderRadius:"7px",fontSize:"12px"})}>← Tillbaka</button>
      <div style={{fontSize:"16px",fontWeight:"bold",color:"#fff"}}>📋 Historik</div>
    </div>
    <div style={{padding:"12px"}}>
      {hist.length===0
        ?<div style={{textAlign:"center",color:"#444",padding:"50px 0",fontSize:"14px"}}>Inga sparade ronder</div>
        :[...hist].reverse().map(r=>{
          const PC2=getPC(r.players);
          const maxW=Math.max(...r.players.map(p=>r.wolfTotals[p]||0));
          const wins=r.players.filter(p=>(r.wolfTotals[p]||0)===maxW);
          return <div key={r.id} onClick={()=>setDetail(r)} style={{background:"rgba(255,255,255,0.04)",border:"1px solid #2d6a4f",borderRadius:"11px",padding:"12px 14px",marginBottom:"8px",cursor:"pointer"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}>
              <div style={{fontSize:"13px",fontWeight:"bold",color:"#fff"}}>{r.course}</div>
              <div style={{fontSize:"10px",color:"#6dbf8a"}}>{r.date}</div>
            </div>
            <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"3px"}}>
              {r.players.map(pl=>{const pts=r.wolfTotals[pl]||0;return(
                <span key={pl} style={{fontSize:"11px",color:PC2[pl],fontWeight:wins.includes(pl)?"bold":"normal"}}>{wins.includes(pl)&&"🏆"}{pl}: {pts>0?`+${pts}`:pts}p</span>
              );})}
            </div>
            {r.snakeHolder&&<div style={{fontSize:"10px",color:"#e05252"}}>🐍 {r.snakeHolder}</div>}
          </div>;
        })
      }
    </div>
  </div>;
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState("setup");
  const [players, setPlayers] = useState(["Anton","Player 2","Player 3","Player 4"]);
  const [hcpInputs, setHcpInputs] = useState({Anton:"6.5","Player 2":"8.0","Player 3":"9.0","Player 4":"10.0"});
  const [selectedCourse, setSelectedCourse] = useState("Delsjö GK – Stora banan");
  const [wolfOrderInput, setWolfOrderInput] = useState(["Anton","Player 2","Player 3","Player 4"]);
  const [wolfStake, setWolfStake] = useState("100");
  const [snakeStake, setSnakeStake] = useState("50");
  const [b50Active, setB50Active] = useState(false);
  const [b50Players, setB50Players] = useState(["Anton","Player 2","Player 3","Player 4"]);

  const [scores, setScores] = useState(null);
  const [snake, setSnake] = useState(null); // snake[hole][player] = bool
  const [wolfData, setWolfData] = useState(null);
  const [extraOvr, setExtraOvr] = useState(null);
  const [pointsOvr, setPointsOvr] = useState(null);
  const [playersData, setPlayersData] = useState({});

  const [view, setView] = useState("wolf");
  const [activeHole, setActiveHole] = useState(0);
  const [showExtraEdit, setShowExtraEdit] = useState(false);
  const [showPointsEdit, setShowPointsEdit] = useState(false);
  const [showReset, setShowReset] = useState(false);
  const [showRules, setShowRules] = useState(false);
  const [showFinalCard, setShowFinalCard] = useState(false);
  const [editingHcp, setEditingHcp] = useState(false);

  const course = COURSES[selectedCourse];
  const courseHoles = course?.holes_data || [];
  const numHoles = courseHoles.length;
  const PC = getPC(players);

  useEffect(()=>{
    try{
      const raw=localStorage.getItem(SAVE_KEY);
      if(!raw)return;
      const s=JSON.parse(raw);
      if(s.screen==="game"&&s.players&&s.gameState){
        setPlayers(s.players);setHcpInputs(s.hcpInputs||{});setSelectedCourse(s.selectedCourse);
        setWolfOrderInput(s.wolfOrderInput||s.players);setPlayersData(s.playersData||{});
        setWolfStake(s.wolfStake||"100");setSnakeStake(s.snakeStake||"50");
        setB50Active(s.b50Active||false);setB50Players(s.b50Players||s.players||[]);
        const gs=s.gameState;
        setScores(gs.scores);setSnake(gs.snake);setWolfData(gs.wolfData);
        setExtraOvr(gs.extraOvr);setPointsOvr(gs.pointsOvr);
        setScreen("game");
      }
    }catch{}
  },[]);

  useEffect(()=>{
    if(screen!=="game"||!scores)return;
    try{localStorage.setItem(SAVE_KEY,JSON.stringify({screen,players,hcpInputs,selectedCourse,wolfOrderInput,playersData,wolfStake,snakeStake,b50Active,b50Players,gameState:{scores,snake,wolfData,extraOvr,pointsOvr}}));}catch{}
  },[screen,scores,snake,wolfData,extraOvr,pointsOvr,players,playersData,wolfStake,snakeStake,b50Active,b50Players]);

  const mkDef=(pls,ch)=>{const n=ch.length;return{
    scores:Object.fromEntries(pls.map(p=>[p,Array(n).fill("")])),
    snake:Array(n).fill(null).map(()=>Object.fromEntries(pls.map(p=>[p,false]))),
    wolfData:Array(n).fill(null).map(()=>({mode:'normal',partner:null})),
    extraOvr:Array(n).fill(null).map(()=>Object.fromEntries(pls.map(p=>[p,""]))),
    pointsOvr:Array(n).fill(null).map(()=>Object.fromEntries(pls.map(p=>[p,""]))),
  };};

  const startGame=()=>{
    const c=COURSES[selectedCourse];const n=c.holes_data.length;
    const pd={};players.forEach(p=>{const ph=playingHcp(hcpInputs[p],c.slope,n);pd[p]={hcpIndex:parseFloat(hcpInputs[p])||0,playingHcp:ph};});
    setPlayersData(pd);
    // Make sure b50Players only contains actual players
    setB50Players(prev=>b50Active?prev.filter(p=>players.includes(p)):players);
    const def=mkDef(players,c.holes_data);
    setScores(def.scores);setSnake(def.snake);setWolfData(def.wolfData);setExtraOvr(def.extraOvr);setPointsOvr(def.pointsOvr);
    setActiveHole(0);setScreen("game");
  };

  const setScore=(pl,hi,val)=>{const v=val===""?"":parseInt(val)||"";setScores(prev=>{const c={...prev,[pl]:[...prev[pl]]};c[pl][hi]=v;return c;});};
  const toggleSnake=(hi,pl)=>{setSnake(prev=>{const c=prev.map(h=>({...h}));c[hi][pl]=!c[hi][pl];return c;});};
  const setExtraOvrd=(hi,pl,val)=>{setExtraOvr(prev=>{const c=prev.map(h=>({...h}));c[hi][pl]=val===""?"":Math.max(0,parseInt(val)||0);return c;});};
  const resetExtra=(hi)=>{setExtraOvr(prev=>{const c=prev.map(h=>({...h}));c[hi]=Object.fromEntries(players.map(p=>[p,""]));return c;});};
  const setPointOvrd=(hi,pl,val)=>{setPointsOvr(prev=>{const c=prev.map(h=>({...h}));c[hi][pl]=val;return c;});};
  const resetPoints=(hi)=>{setPointsOvr(prev=>{const c=prev.map(h=>({...h}));c[hi]=Object.fromEntries(players.map(p=>[p,""]));return c;});};
  const setWolfMode=(hi,mode)=>{setWolfData(prev=>{const c=[...prev];c[hi]={...c[hi],mode,partner:mode!=='normal'?null:c[hi].partner};return c;});};
  const setWolfPartner=(hi,partner)=>{setWolfData(prev=>{const c=[...prev];c[hi]={...c[hi],mode:'normal',partner:c[hi].partner===partner?null:partner};return c;});};
  const updateHcp=(pl,val)=>{setHcpInputs(prev=>({...prev,[pl]:val}));if(!course)return;const ph=playingHcp(val,course.slope,numHoles);setPlayersData(prev=>({...prev,[pl]:{hcpIndex:parseFloat(val)||0,playingHcp:ph}}));};

  const rollovers = scores&&wolfData ? computeRollovers(numHoles,wolfData,scores,players,playersData,extraOvr,pointsOvr,wolfOrderInput,courseHoles) : Array(numHoles).fill(0);

  const wolfTotal=pl=>{let acc=0,total=0;for(let i=0;i<numHoles;i++){const r=getWolfPoints(i,wolfData,scores,players,playersData,extraOvr,pointsOvr,wolfOrderInput,courseHoles,acc);if(!r)continue;if(r.tie){acc+=2;}else{total+=(r.points[pl]||0);acc=0;}}return total;};
  const stfTotal=pl=>courseHoles.reduce((a,h,i)=>{const s=parseInt(scores?.[pl]?.[i]);if(!s)return a;return a+(calcStf(s,h.par,getExtraShots(pl,i,players,playersData,extraOvr,courseHoles))??0);},0);
  const totalStrokes=pl=>(scores?.[pl]||[]).reduce((a,v)=>a+(parseInt(v)||0),0);

  const snakeHist = scores&&snake ? calcSnakeHistory(players,snake,numHoles) : [];
  const snakeHolder = snakeHist.filter(h=>h.holder).slice(-1)[0]?.holder||null;

  const saveToHistory=()=>{
    try{
      const hist=JSON.parse(localStorage.getItem(HIST_KEY)||"[]");
      hist.push({id:Date.now(),date:new Date().toLocaleDateString("sv-SE",{year:"numeric",month:"short",day:"numeric"}),course:selectedCourse,players:[...players],hcpInputs:{...hcpInputs},wolfTotals:Object.fromEntries(players.map(p=>[p,wolfTotal(p)])),stfTotals:Object.fromEntries(players.map(p=>[p,stfTotal(p)])),snakeHolder,wolfStake:parseInt(wolfStake)||0,snakeStake:parseInt(snakeStake)||0,b50Active,b50Players:[...b50Players]});
      localStorage.setItem(HIST_KEY,JSON.stringify(hist));
    }catch{}
    setShowFinalCard(false);
  };

  const resetAll=()=>{if(!course)return;const def=mkDef(players,course.holes_data);setScores(def.scores);setSnake(def.snake);setWolfData(def.wolfData);setExtraOvr(def.extraOvr);setPointsOvr(def.pointsOvr);setShowReset(false);setActiveHole(0);localStorage.removeItem(SAVE_KEY);};

  // ── SETUP ────────────────────────────────────────────────────────────────
  if(screen==="setup"){
    const mvPl=(f,d)=>{const t=f+d;if(t<0||t>=players.length)return;const n=[...players];[n[f],n[t]]=[n[t],n[f]];setPlayers(n);};
    const mvWolf=(f,d)=>{const t=f+d;if(t<0||t>=wolfOrderInput.length)return;const n=[...wolfOrderInput];[n[f],n[t]]=[n[t],n[f]];setWolfOrderInput(n);};
    const updName=(i,val)=>{const old=players[i];const n=[...players];n[i]=val;setPlayers(n);const nh={...hcpInputs};nh[val]=nh[old]||"18";delete nh[old];setHcpInputs(nh);setWolfOrderInput(wolfOrderInput.map(p=>p===old?val:p));};
    const addPl=()=>{if(players.length>=6)return;const nm=`Spelare ${players.length+1}`;setPlayers([...players,nm]);setHcpInputs(prev=>({...prev,[nm]:"18"}));setWolfOrderInput(prev=>[...prev,nm]);};
    const remPl=(i)=>{if(players.length<=2)return;const pl=players[i];setPlayers(players.filter((_,j)=>j!==i));setHcpInputs(prev=>{const c={...prev};delete c[pl];return c;});setWolfOrderInput(wolfOrderInput.filter(p=>p!==pl));};
    return <div style={{minHeight:"100vh",background:"#0e2318",paddingBottom:"60px"}}>
      <div style={{background:"linear-gradient(160deg,#091a0f 0%,#1a4731 45%,#2d6a4f 75%,#1a4731 100%)",padding:"36px 16px 24px",textAlign:"center",borderBottom:"2px solid #d4af37",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",inset:0,backgroundImage:"radial-gradient(ellipse at 50% 0%,rgba(212,175,55,0.1) 0%,transparent 65%)",pointerEvents:"none"}}/>
        <div style={{fontSize:"36px",marginBottom:"8px",filter:"drop-shadow(0 2px 10px rgba(212,175,55,0.5))"}}>⛳</div>
        <div style={{fontSize:"32px",fontWeight:"bold",color:"#f5c842",letterSpacing:"1px",textShadow:"0 2px 16px rgba(212,175,55,0.45)"}}>Wolf & Snake</div>
        <div style={{width:"56px",height:"2px",background:"linear-gradient(90deg,transparent,#d4af37,transparent)",margin:"10px auto 8px"}}/>
        <div style={{fontSize:"11px",color:"#a8c5a0",letterSpacing:"4px",textTransform:"uppercase"}}>Inställningar</div>
      </div>
      <div style={{padding:"16px"}}>
        <div style={{marginBottom:"16px"}}>
          <div style={{fontSize:"10px",color:"#a8c5a0",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"7px"}}>⛳ Bana</div>
          <select value={selectedCourse} onChange={e=>setSelectedCourse(e.target.value)} style={{width:"100%",padding:"11px",background:"#1a4731",border:"1px solid #40916c",borderRadius:"9px",color:"#fff",fontSize:"13px",outline:"none",WebkitAppearance:"none"}}>
            {Object.keys(COURSES).map(n=><option key={n} value={n}>{n} ({COURSES[n].holes}h · slope {COURSES[n].slope})</option>)}
          </select>
        </div>
        <div style={{marginBottom:"16px"}}>
          <div style={{fontSize:"10px",color:"#a8c5a0",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"7px"}}>💰 Insatser</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}}>
            <div><div style={{fontSize:"10px",color:"#f5c842",marginBottom:"4px"}}>🐺 Wolf (kr/spelare)</div><input type="number" min="0" value={wolfStake} onChange={e=>setWolfStake(e.target.value)} style={{width:"100%",padding:"9px",textAlign:"center",background:"rgba(255,215,0,0.08)",border:"1px solid #ffd70066",borderRadius:"8px",color:"#f5c842",fontSize:"16px",outline:"none"}}/></div>
            <div><div style={{fontSize:"10px",color:"#e05252",marginBottom:"4px"}}>🐍 Snake (kr/spelare)</div><input type="number" min="0" value={snakeStake} onChange={e=>setSnakeStake(e.target.value)} style={{width:"100%",padding:"9px",textAlign:"center",background:"rgba(255,107,107,0.08)",border:"1px solid #ff6b6b66",borderRadius:"8px",color:"#e05252",fontSize:"16px",outline:"none"}}/></div>
          </div>
          {/* B50 section */}
          <button onClick={()=>{setB50Active(v=>!v);if(!b50Active)setB50Players([...players]);}} style={btn({width:"100%",padding:"11px",borderRadius:"9px",border:`2px solid ${b50Active?"#6dbf8a":"#2d6a4f"}`,background:b50Active?"rgba(109,191,138,0.1)":"rgba(0,0,0,0.2)",color:b50Active?"#6dbf8a":"#6a8a7a",fontSize:"13px",fontWeight:"bold",marginBottom:b50Active?"8px":"0",display:"flex",alignItems:"center",justifyContent:"space-between"})}>
            <span>🐦 B50</span>
            <span style={{fontSize:"11px",color:b50Active?"#6dbf8a":"#3a5a47"}}>{b50Active?"AKTIV ✓":"Inaktiv"}</span>
          </button>
          {b50Active&&<div style={{background:"rgba(0,0,0,0.2)",border:"1px solid #2d6a4f",borderRadius:"9px",padding:"12px"}}>
            <div style={{fontSize:"11px",color:"#a8c5a0",marginBottom:"10px"}}>En birdie = alla B50-spelare swishar den spelaren <span style={{color:"#6dbf8a",fontWeight:"bold"}}>50 kr</span>. Välj vilka som är med:</div>
            <div style={{display:"grid",gridTemplateColumns:`repeat(${Math.min(players.length,4)},1fr)`,gap:"6px",marginBottom:"10px"}}>
              {players.map((pl,i)=>{
                const inB50=b50Players.includes(pl);
                return <button key={pl} onClick={()=>setB50Players(prev=>inB50?prev.filter(p=>p!==pl):[...prev,pl])} style={btn({padding:"8px 4px",borderRadius:"8px",border:`2px solid ${inB50?PCOLORS[i%6]:"#2d6a4f"}`,background:inB50?`rgba(${rgb(PCOLORS[i%6])},0.15)`:"rgba(0,0,0,0.2)",color:inB50?PCOLORS[i%6]:"#4a6a5a",fontSize:"12px",fontWeight:"bold",display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"})}>
                  <span style={{fontSize:"16px"}}>{inB50?"✅":"⬜"}</span>
                  <span>{pl}</span>
                </button>;
              })}
            </div>
            <div style={{fontSize:"10px",color:"#6a8a7a",textAlign:"center"}}>{b50Players.length} spelare med · {b50Players.length>1?`${(b50Players.length-1)*50} kr per birdie att vinna`:"Minst 2 spelare krävs"}</div>
          </div>}
        </div>
        <div style={{marginBottom:"16px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"7px"}}>
            <div style={{fontSize:"10px",color:"#a8c5a0",letterSpacing:"2px",textTransform:"uppercase"}}>👥 Spelare & HCP-index</div>
            {players.length<6&&<button onClick={addPl} style={btn({padding:"4px 10px",borderRadius:"6px",border:"1px solid #40916c",background:"transparent",color:"#a8c5a0",fontSize:"11px"})}>+ Lägg till</button>}
          </div>
          {players.map((pl,i)=>(
            <div key={i} style={{background:"rgba(255,255,255,0.04)",border:`1px solid ${PCOLORS[i%6]}44`,borderRadius:"10px",padding:"10px",marginBottom:"7px"}}>
              <div style={{display:"flex",gap:"6px",alignItems:"center",marginBottom:"7px"}}>
                <input type="text" value={pl} onChange={e=>updName(i,e.target.value)} style={{flex:1,padding:"7px 10px",background:"rgba(255,255,255,0.08)",border:`1px solid ${PCOLORS[i%6]}`,borderRadius:"7px",color:"#fff",fontSize:"15px",fontWeight:"bold",outline:"none"}}/>
                <button onClick={()=>mvPl(i,-1)} disabled={i===0} style={btn({width:"26px",height:"26px",borderRadius:"5px",border:"1px solid #2d6a4f",background:"transparent",color:i===0?"#333":"#a8c5a0",fontSize:"13px"})}>↑</button>
                <button onClick={()=>mvPl(i,1)} disabled={i===players.length-1} style={btn({width:"26px",height:"26px",borderRadius:"5px",border:"1px solid #2d6a4f",background:"transparent",color:i===players.length-1?"#333":"#a8c5a0",fontSize:"13px"})}>↓</button>
                {players.length>2&&<button onClick={()=>remPl(i)} style={btn({width:"26px",height:"26px",borderRadius:"5px",border:"1px solid #ff6b6b44",background:"transparent",color:"#e05252",fontSize:"13px"})}>×</button>}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                <div style={{fontSize:"10px",color:"#a8c5a0",width:"70px"}}>HCP-index:</div>
                <input type="number" min="0" max="54" step="0.1" value={hcpInputs[pl]||""} onChange={e=>setHcpInputs(prev=>({...prev,[pl]:e.target.value}))} style={{width:"68px",padding:"5px",textAlign:"center",background:"rgba(255,255,255,0.08)",border:`1px solid ${PCOLORS[i%6]}`,borderRadius:"7px",color:"#fff",fontSize:"15px",outline:"none"}}/>
                <div style={{fontSize:"10px",color:"#6dbf8a"}}>→ Spelh: <b style={{color:PCOLORS[i%6]}}>{playingHcp(hcpInputs[pl],COURSES[selectedCourse]?.slope||113,COURSES[selectedCourse]?.holes||18)}</b></div>
              </div>
            </div>
          ))}
        </div>
        <div style={{marginBottom:"20px"}}>
          <div style={{fontSize:"10px",color:"#a8c5a0",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"7px"}}>🐺 Wolf-ordning (slår sist = Wolf)</div>
          <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid #2d6a4f",borderRadius:"10px",padding:"10px"}}>
            {wolfOrderInput.map((pl,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:"7px",marginBottom:i<wolfOrderInput.length-1?"7px":"0"}}>
                <div style={{fontSize:"10px",color:"#6dbf8a",width:"50px"}}>Hål {i+1},{i+wolfOrderInput.length+1}…</div>

          ?<div style={{display:"grid",gridTemplateColumns:`repeat(${players.length},1fr)`,gap:"5px"}}>
            {players.map(pl=>{const pts=wolfResult.points[pl];return(
              <div key={pl} style={{textAlign:"center",padding:"8px 2px",background:pts>0?"rgba(74,158,114,0.15)":pts<0?"rgba(224,82,82,0.12)":"rgba(0,0,0,0.15)",borderRadius:"8px",border:`1px solid ${pts>0?"#4a9e72":pts<0?"#e05252":"#2d6a4f"}`}}>
                <div style={{fontSize:"10px",color:PC[pl],fontWeight:"bold",marginBottom:"2px"}}>{pl}</div>
                <div style={{fontSize:"22px",fontWeight:"bold",color:pts>0?"#6dbf8a":pts<0?"#e05252":"#4a6a5a",lineHeight:1}}>{pts>0?`+${pts}`:pts}</div>
              </div>
            );})}
          </div>
          :!wolfResult&&<div style={{color:"#3a5a47",fontSize:"12px",textAlign:"center",padding:"8px"}}>Ange slag för alla spelare</div>
        }
        {showPointsEdit&&<div style={{borderTop:"1px solid #2d6a4f",paddingTop:"8px",marginTop:"8px"}}>
          <div style={{display:"grid",gridTemplateColumns:`repeat(${players.length},1fr)`,gap:"4px",marginBottom:"5px"}}>
            {players.map(pl=>{const ov=pointsOvr[activeHole][pl];const av=wolfResult?.points?.[pl];return(
              <div key={pl} style={{textAlign:"center"}}>
                <div style={{fontSize:"8px",color:PC[pl],marginBottom:"2px"}}>{pl}</div>
                <input type="number" min="-10" max="12" value={ov} placeholder={av!==undefined?String(av):"0"} onChange={e=>setPointOvrd(activeHole,pl,e.target.value)} style={{width:"100%",height:"30px",textAlign:"center",background:ov!==""?"rgba(240,140,0,0.12)":"rgba(255,255,255,0.05)",border:`1px solid ${ov!==""?"#d4841c":"#2d6a4f"}`,borderRadius:"5px",color:ov!==""?"#d4841c":"#aaa",fontSize:"13px",outline:"none"}}/>
              </div>
            );})}
          </div>
          <div style={{display:"flex",gap:"5px"}}>
            <button onClick={()=>{if(wolfResult&&!wolfResult.tie)players.forEach(pl=>setPointOvrd(activeHole,pl,String(wolfResult.points[pl])));}} style={btn({padding:"3px 8px",borderRadius:"5px",border:"1px solid #40916c",background:"transparent",color:"#a8c5a0",fontSize:"9px"})}>Hämta auto</button>
            {hasPointsOvr&&<button onClick={()=>resetPoints(activeHole)} style={btn({padding:"3px 8px",borderRadius:"5px",border:"1px solid #ff6b6b",background:"transparent",color:"#e05252",fontSize:"9px"})}>↩ Återställ</button>}
          </div>
        </div>}
      </div>

      {/* Prev / Next navigation */}
      <div style={{display:"flex",gap:"8px",marginBottom:"8px",paddingBottom:"2px"}}>
        <button
          onClick={()=>{setActiveHole(Math.max(0,activeHole-1));setShowExtraEdit(false);setShowPointsEdit(false);}}
          disabled={activeHole===0}
          style={btn({flex:1,padding:"12px 0",borderRadius:"10px",border:"1px solid #4a9e72",background:activeHole===0?"rgba(0,0,0,0.1)":"rgba(26,71,49,0.6)",color:activeHole===0?"#2a4a38":"#a8c5a0",fontSize:"15px",fontWeight:"bold"})}>
          ← Hål {courseHoles[Math.max(0,activeHole-1)].hole}
        </button>
        <button
          onClick={()=>{setActiveHole(Math.min(numHoles-1,activeHole+1));setShowExtraEdit(false);setShowPointsEdit(false);}}
          disabled={activeHole===numHoles-1}
          style={btn({flex:1,padding:"12px 0",borderRadius:"10px",border:"1px solid #4a9e72",background:activeHole===numHoles-1?"rgba(0,0,0,0.1)":"rgba(26,71,49,0.6)",color:activeHole===numHoles-1?"#2a4a38":"#a8c5a0",fontSize:"15px",fontWeight:"bold"})}>
          Hål {courseHoles[Math.min(numHoles-1,activeHole+1)].hole} →
        </button>
      </div>

      <div style={{textAlign:"center",paddingBottom:"10px"}}>
        {!showReset
          ?<button onClick={()=>setShowReset(true)} style={btn({padding:"5px 14px",borderRadius:"6px",border:"1px solid #1e3a28",background:"transparent",color:"#2a4a38",fontSize:"10px"})}>🗑 Nollställ</button>
          :<div style={{background:"rgba(255,107,107,0.08)",border:"1px solid #e05252",borderRadius:"9px",padding:"10px"}}>
            <div style={{color:"#e05252",fontSize:"11px",marginBottom:"7px"}}>Nollställ hela ronden?</div>
            <div style={{display:"flex",gap:"7px",justifyContent:"center"}}>
              <button onClick={resetAll} style={btn({padding:"5px 14px",borderRadius:"6px",border:"1px solid #e05252",background:"rgba(255,107,107,0.2)",color:"#e05252",fontSize:"11px",fontWeight:"bold"})}>Ja</button>
              <button onClick={()=>setShowReset(false)} style={btn({padding:"5px 14px",borderRadius:"6px",border:"1px solid #4a9e72",background:"transparent",color:"#a8c5a0",fontSize:"11px"})}>Avbryt</button>
            </div>
          </div>
        }
      </div>
    </div>}

    {/* ===== SCORES ===== */}
    {view==="scores"&&<div style={{padding:"10px 10px 0"}}>
      <div style={{marginBottom:"10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:"16px",fontWeight:"bold",color:"#f5c842"}}>📋 Scorekort</div>
        <button onClick={()=>setEditingHcp(!editingHcp)} style={btn({padding:"6px 12px",borderRadius:"7px",border:"1px solid #4a9e72",background:editingHcp?"#2d6a4f":"rgba(26,71,49,0.5)",color:"#a8c5a0",fontSize:"11px"})}>⚙️ {editingHcp?"Stäng HCP":"Ändra HCP"}</button>
      </div>
      {editingHcp&&<div style={{display:"grid",gridTemplateColumns:`repeat(${players.length},1fr)`,gap:"6px",marginBottom:"10px",background:"rgba(0,0,0,0.2)",borderRadius:"9px",padding:"10px",border:"1px solid #2d6a4f"}}>
        {players.map(pl=><div key={pl}>
          <div style={{fontSize:"10px",color:PC[pl],marginBottom:"4px",textAlign:"center",fontWeight:"bold"}}>{pl}</div>
          <input type="number" min="0" max="54" step="0.1" value={hcpInputs[pl]||""} onChange={e=>updateHcp(pl,e.target.value)} style={{width:"100%",padding:"6px 2px",textAlign:"center",background:"rgba(255,255,255,0.08)",border:`1px solid ${PC[pl]}66`,borderRadius:"6px",color:"#f0ede0",fontSize:"13px",outline:"none"}}/>
          <div style={{fontSize:"8px",color:"#6dbf8a",marginTop:"2px",textAlign:"center"}}>Spelh: {playersData[pl]?.playingHcp||0}</div>
        </div>)}
      </div>}

      {[0, Math.ceil(numHoles/2)].filter(h=>h<numHoles).map(half=>{
        const end=Math.min(half+Math.ceil(numHoles/2),numHoles);
        return <div key={half} style={{marginBottom:"14px"}}>
          {/* Half header */}
          <div style={{background:"linear-gradient(90deg,#1a4731,#2d6a4f)",borderRadius:"8px 8px 0 0",padding:"8px 12px",fontSize:"12px",letterSpacing:"2px",color:"#f5c842",textTransform:"uppercase",fontWeight:"bold",borderBottom:"1px solid #d4af3744"}}>
            {half===0?"Ut":"In"} – hål {courseHoles[half].hole}–{courseHoles[end-1].hole}
          </div>
          <div style={{background:"rgba(0,0,0,0.15)",border:"1px solid #2d6a4f",borderTop:"none",borderRadius:"0 0 8px 8px",overflow:"hidden"}}>
            {/* Column headers: Hål | Par | [player names + their extra-shot holes] */}
            <div style={{display:"grid",gridTemplateColumns:`28px 22px repeat(${players.length},1fr)`,borderBottom:"2px solid #2d6a4f",background:"rgba(26,71,49,0.6)"}}>
              <div style={{padding:"6px 2px",fontSize:"9px",color:"#a8c5a0",textAlign:"center",letterSpacing:"1px"}}>HÅL</div>
              <div style={{padding:"6px 1px",fontSize:"9px",color:"#a8c5a0",textAlign:"center",letterSpacing:"1px"}}>PAR</div>
              {players.map(pl=>{
                // Collect all hole numbers where this player gets an extra shot in this half
                const extraHoles = courseHoles.slice(half,end).filter((_,i)=>getExtraShots(pl,half+i,players,playersData,extraOvr,courseHoles)>0).map(h=>h.hole);
                return <div key={pl} style={{padding:"5px 2px",textAlign:"center"}}>
                  <div style={{fontSize:"13px",fontWeight:"bold",color:PC[pl],letterSpacing:"0.3px"}}>{pl}</div>
                  {extraHoles.length>0
                    ? <div style={{fontSize:"7px",color:"#d4841c",marginTop:"2px",lineHeight:1.3}}>+slag: {extraHoles.join(", ")}</div>
                    : <div style={{fontSize:"7px",color:"#3a5a47",marginTop:"2px"}}>inga extra</div>
                  }
                  <div style={{fontSize:"6px",color:"#6a8a7a",marginTop:"1px"}}>slag · p · 🐍</div>
                </div>;
              })}
            </div>
            {/* Hole rows */}
            {courseHoles.slice(half,end).map((h,i)=>{
              const idx=half+i;
              const anyExtra=players.some(p=>getExtraShots(p,idx,players,playersData,extraOvr,courseHoles)>0);
              return <div key={h.hole} style={{display:"grid",gridTemplateColumns:`28px 22px repeat(${players.length},1fr)`,background:idx%2===0?"transparent":"rgba(255,255,255,0.025)",borderBottom:"1px solid rgba(45,106,79,0.25)",alignItems:"center",minHeight:"38px"}}>
                <div style={{textAlign:"center",fontSize:"12px",fontWeight:"bold",color:"#f5c842",position:"relative"}}>
                  {h.hole}
                  {anyExtra&&<span style={{position:"absolute",top:"0",right:"3px",fontSize:"7px",color:"#d4841c",lineHeight:1}}>+</span>}
                </div>
                <div style={{textAlign:"center",fontSize:"11px",color:"#6a8a7a"}}>{h.par}</div>
                {players.map(pl=>{
                  const s=parseInt(scores[pl][idx])||0;
                  const extra=getExtraShots(pl,idx,players,playersData,extraOvr,courseHoles);
                  const pts=s?calcStf(s,h.par,extra):null;
                  const isSnake=snake[idx][pl];
                  const ptsColor = pts===null?"#2a4a38" : pts>=3?"#f5c842" : pts===2?"#6dbf8a" : pts===1?"#4a9e72" : "#c05a5a";
                  return <div key={pl} style={{padding:"2px 1px",position:"relative"}}>
                    {/* Fixed-height column: symbol row + points row, always centred */}
                    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"36px"}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"18px",width:"100%",gap:"2px"}}>
                        <ScoreSymbol s={s} par={h.par} size={13} fontSize={11}/>
                        {extra>0&&<span style={{fontSize:"8px",color:"#d4841c",fontWeight:"bold",lineHeight:1}}>+{extra}</span>}
                      </div>
                      <div style={{fontSize:"9px",fontWeight:"bold",color:ptsColor,lineHeight:1,marginTop:"2px",textAlign:"center"}}>{pts!==null?`${pts}p`:"–"}</div>
                    </div>
                    {/* Snake badge: absolute, doesn't shift numbers */}
                    {isSnake&&<span style={{position:"absolute",top:"50%",right:"1px",transform:"translateY(-50%)",fontSize:"9px",lineHeight:1,opacity:0.9}}>🐍</span>}
                  </div>;
                })}
              </div>;
            })}
            {/* Totals row */}
            <div style={{display:"grid",gridTemplateColumns:`28px 22px repeat(${players.length},1fr)`,background:"rgba(26,71,49,0.7)",padding:"5px 0",borderTop:"1px solid #d4af3733"}}>
              <div style={{gridColumn:"1/3",textAlign:"center",fontSize:"9px",color:"#a8c5a0",display:"flex",alignItems:"center",justifyContent:"center",letterSpacing:"1px"}}>Σ</div>
              {players.map(pl=>{
                const slag=courseHoles.slice(half,end).reduce((a,_,i)=>a+(parseInt(scores[pl][half+i])||0),0);
                const stf=courseHoles.slice(half,end).reduce((a,h,i)=>{const s=parseInt(scores[pl][half+i]);if(!s)return a;const ex=getExtraShots(pl,half+i,players,playersData,extraOvr,courseHoles);return a+(calcStf(s,h.par,ex)||0);},0);
                return <div key={pl} style={{textAlign:"center",padding:"2px 0"}}>
                  <div style={{fontSize:"12px",fontWeight:"bold",color:PC[pl]}}>{slag||"–"}</div>
                  <div style={{fontSize:"9px",color:"#6dbf8a",fontWeight:"bold"}}>{stf}p</div>
                </div>;
              })}
            </div>
          </div>
        </div>;
      })}

      {/* Legend */}
      <div style={{display:"flex",alignItems:"center",gap:"6px",marginBottom:"10px",fontSize:"10px",color:"#6a8a7a"}}>
        <span style={{color:"#d4841c",fontWeight:"bold",fontSize:"9px"}}>+1</span>
        <span>= extra slag (spelhandicap)</span>
        <span style={{marginLeft:"8px"}}>🐍 = 3-putt (snake)</span>
      </div>

      {/* Stableford totals */}
      <div style={{background:"linear-gradient(160deg,#0e2318,#1a4731)",borderRadius:"10px",padding:"14px 16px",border:"1px solid #d4af3755",marginBottom:"10px",boxShadow:"0 3px 16px rgba(0,0,0,0.4)"}}>
        <div style={{fontSize:"12px",fontWeight:"bold",color:"#f5c842",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"10px"}}>📊 Stableford – totalt</div>
        <div style={{display:"grid",gridTemplateColumns:`repeat(${players.length},1fr)`,gap:"8px"}}>
          {[...players].sort((a,b)=>stfTotal(b)-stfTotal(a)).map((pl,rank)=>{
            const maxStf=Math.max(...players.map(p=>stfTotal(p)));
            const isWin=stfTotal(pl)===maxStf;
            return <div key={pl} style={{textAlign:"center",background:isWin?"rgba(212,175,55,0.1)":"rgba(0,0,0,0.2)",borderRadius:"8px",padding:"8px 4px",border:`1px solid ${isWin?"#d4af37":"#2d6a4f"}`}}>
              <div style={{fontSize:"13px",fontWeight:"bold",color:PC[pl],marginBottom:"2px"}}>{isWin?"🏆 ":""}{pl}</div>
              <div style={{fontSize:"24px",fontWeight:"bold",color:isWin?"#f5c842":"#f0ede0",lineHeight:1}}>{stfTotal(pl)}<span style={{fontSize:"11px",color:"#a8c5a0"}}>p</span></div>
              <div style={{fontSize:"10px",color:"#6a8a7a",marginTop:"2px"}}>{totalStrokes(pl)||0} slag</div>
            </div>;
          })}
        </div>
      </div>

      {/* Wolf standings */}
      <div style={{background:"rgba(0,0,0,0.2)",borderRadius:"10px",padding:"12px 14px",border:"1px solid #2d6a4f",marginBottom:"8px"}}>
        <div style={{fontSize:"12px",fontWeight:"bold",color:"#f5c842",marginBottom:"8px"}}>🐺 Wolf – ställning</div>
        <div style={{display:"grid",gridTemplateColumns:`repeat(${players.length},1fr)`,gap:"6px"}}>
          {[...players].sort((a,b)=>wolfTotal(b)-wolfTotal(a)).map((pl,rank)=>{
            const pts=wolfTotal(pl);
            const maxW=Math.max(...players.map(p=>wolfTotal(p)));
            const isWin=pts===maxW;
            return <div key={pl} style={{textAlign:"center",background:isWin?"rgba(212,175,55,0.08)":"rgba(0,0,0,0.15)",borderRadius:"7px",padding:"6px 3px",border:`1px solid ${isWin?"#d4af3766":"#1e3a28"}`}}>
              <div style={{fontSize:"12px",fontWeight:"bold",color:PC[pl]}}>{isWin?"🏆 ":""}{pl}</div>
              <div style={{fontSize:"20px",fontWeight:"bold",color:pts>0?"#6dbf8a":pts<0?"#e05252":"#3a5a47",lineHeight:1.1}}>{pts>0?`+${pts}`:pts}</div>
            </div>;
          })}
        </div>
      </div>

      {/* Snake standings */}
      <div style={{background:"rgba(0,0,0,0.2)",borderRadius:"10px",padding:"12px 14px",border:`1px solid ${snakeHolder?"rgba(224,82,82,0.3)":"#2d6a4f"}`,marginBottom:b50Active&&b50Players.length>=2?"8px":"12px"}}>
        <div style={{fontSize:"12px",fontWeight:"bold",color:"#f0ede0",marginBottom:"8px"}}>🐍 Snake – ställning</div>
        <div style={{display:"grid",gridTemplateColumns:`repeat(${players.length},1fr)`,gap:"6px"}}>
          {players.map(pl=>{
            const count=courseHoles.filter((_,i)=>snake[i][pl]).length;
            const holds=snakeHolder===pl;
            return <div key={pl} style={{textAlign:"center",background:holds?"rgba(224,82,82,0.1)":"rgba(0,0,0,0.15)",borderRadius:"7px",padding:"6px 3px",border:`1px solid ${holds?"rgba(224,82,82,0.4)":"#1e3a28"}`}}>
              <div style={{fontSize:"12px",fontWeight:"bold",color:PC[pl]}}>{pl}{holds?" 🐍":""}</div>
              <div style={{fontSize:"11px",color:count>0?"#e05252":"#3a5a47",marginTop:"2px"}}>{count>0?`×${count} 3-putt`:"Ingen 3-putt"}</div>
            </div>;
          })}
        </div>
      </div>

      {/* B50 standings */}
      {b50Active&&b50Players.length>=2&&(()=>{
        const b50Counts = Object.fromEntries(b50Players.map(p=>[p,courseHoles.filter((h,i)=>{
          const s=parseInt(scores[p][i]);
          const ex=getExtraShots(p,i,players,playersData,extraOvr,courseHoles);
          return s&&(s-ex)<h.par;
        }).length]));
        return <div style={{background:"rgba(0,0,0,0.2)",borderRadius:"10px",padding:"12px 14px",border:"1px solid rgba(109,191,138,0.2)",marginBottom:"12px"}}>
          <div style={{fontSize:"12px",fontWeight:"bold",color:"#6dbf8a",marginBottom:"8px"}}>🐦 B50 – ställning</div>
          <div style={{display:"grid",gridTemplateColumns:`repeat(${b50Players.length},1fr)`,gap:"6px"}}>
            {[...b50Players].sort((a,b)=>b50Counts[b]-b50Counts[a]).map((pl,rank)=>{
              const cnt=b50Counts[pl];
              const earning=cnt*(b50Players.length-1)*50;
              const maxB=Math.max(...b50Players.map(p=>b50Counts[p]));
              const isWin=cnt===maxB&&cnt>0;
              return <div key={pl} style={{textAlign:"center",background:isWin?"rgba(109,191,138,0.1)":"rgba(0,0,0,0.15)",borderRadius:"7px",padding:"6px 3px",border:`1px solid ${isWin?"rgba(109,191,138,0.3)":"#1e3a28"}`}}>
                <div style={{fontSize:"12px",fontWeight:"bold",color:PC[pl]}}>{isWin?"🐦 ":""}{pl}</div>
                <div style={{fontSize:"18px",fontWeight:"bold",color:cnt>0?"#6dbf8a":"#3a5a47",lineHeight:1.1}}>{cnt>0?cnt:"–"}</div>
                <div style={{fontSize:"9px",color:earning>0?"#f5c842":"#3a5a47"}}>{earning>0?`+${earning} kr`:""}</div>
              </div>;
            })}
          </div>
        </div>;
      })()}
    </div>}

    {/* ===== SUMMARY ===== */}
    {view==="summary"&&<div style={{padding:"10px 10px 0"}}>
      <div style={{marginBottom:"14px"}}>
        <div style={{fontSize:"16px",fontWeight:"bold",color:"#f5c842",marginBottom:"10px",textShadow:"0 1px 6px rgba(212,175,55,0.3)"}}>🐺 Wolf – Ställning</div>
        {[...players].sort((a,b)=>wolfTotal(b)-wolfTotal(a)).map((pl,rank)=>{
          const pts=wolfTotal(pl);const isSnake=snakeHolder===pl;
          const maxW=Math.max(...players.map(p=>wolfTotal(p)));const isWin=wolfTotal(pl)===maxW;
          return <div key={pl} style={{display:"flex",alignItems:"center",gap:"10px",background:isWin?"rgba(212,175,55,0.1)":"rgba(0,0,0,0.2)",border:`1px solid ${isWin?"#d4af37":"#2d6a4f"}`,borderRadius:"10px",padding:"11px 13px",marginBottom:"6px",boxShadow:isWin?"0 2px 14px rgba(212,175,55,0.15)":"none"}}>
            <div style={{fontSize:"20px"}}>{isWin?"🏆":rank===1?"🥈":rank===2?"🥉":"–"}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:"16px",fontWeight:"bold",color:PC[pl]}}>{pl}{isSnake&&" 🐍"}</div>
              <div style={{fontSize:"10px",color:"#6a8a7a",marginTop:"1px"}}>HCP {hcpInputs[pl]} · Ph {playersData[pl]?.playingHcp||0} · {stfTotal(pl)}p stf</div>
            </div>
            <div style={{fontSize:"28px",fontWeight:"bold",color:pts>0?"#6dbf8a":pts<0?"#e05252":"#3a6a52"}}>{pts>0?`+${pts}`:pts}</div>
          </div>;
        })}
        {players.filter(p=>{const m=Math.max(...players.map(x=>wolfTotal(x)));return wolfTotal(p)===m;}).length>1&&(
          <div style={{textAlign:"center",fontSize:"13px",color:"#f5c842",marginTop:"6px"}}>🏆 Delad seger: {players.filter(p=>{const m=Math.max(...players.map(x=>wolfTotal(x)));return wolfTotal(p)===m;}).join(" & ")}</div>
        )}
      </div>
      <div style={{padding:"13px 14px",background:snakeHolder?"rgba(224,82,82,0.08)":"rgba(0,0,0,0.2)",border:`1px solid ${snakeHolder?"rgba(224,82,82,0.5)":"#2d6a4f"}`,borderRadius:"10px",marginBottom:"14px"}}>
        <div style={{fontSize:"14px",fontWeight:"bold",color:"#f0ede0",marginBottom:"4px"}}>🐍 Snake</div>
        {snakeHolder
          ?<div style={{fontSize:"18px",fontWeight:"bold",color:PC[snakeHolder]}}>{snakeHolder} bär ormen</div>
          :<div style={{fontSize:"13px",color:"#4a8a6a"}}>Ingen ormbärare 🎉</div>
        }
      </div>
      <button onClick={()=>setShowFinalCard(true)} style={btn({width:"100%",padding:"16px",borderRadius:"12px",border:"none",background:"linear-gradient(160deg,#1a4731,#2d6a4f,#1a4731)",color:"#f5c842",fontSize:"16px",fontWeight:"bold",borderTop:"1px solid #d4af3766",borderBottom:"1px solid #d4af3766",borderLeft:"1px solid #d4af3766",borderRight:"1px solid #d4af3766",marginBottom:"10px",boxShadow:"0 4px 18px rgba(212,175,55,0.2)",letterSpacing:"0.5px"})}>
        🏁 Avsluta ronden – se scorekort
      </button>
    </div>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
